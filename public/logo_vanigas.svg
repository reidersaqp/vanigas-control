    <rect x="2" y="2" width="50" height="50" rx="13" fill="#0c2333" stroke="#48c9b0" stroke-width="3"/>
    <!-- Letter V -->
    <text x="27" y="36" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" text-anchor="middle">V</text>
    <!-- Brand Name -->
    <text x="68" y="28" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="1">VANIGAS</text>
    <!-- Subtitle -->
    <text x="68" y="45" fill="#4fa89b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">Control comercial</text>
